# Prefixo continua sendo Ctrl+B
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Histórico
set -g history-limit 50000

# Mouse
set -g mouse on

# Não renomear automaticamente a janela
set -g allow-rename off
set -g automatic-rename off

# Índices começando em 1
set -g base-index 1
setw -g pane-base-index 1

# Criar pane mantendo o diretório atual
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Navegação entre panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Recarregar configuração
bind r source-file ~/.tmux.conf \; display-message "tmux config recarregada"

# Modo de cópia estilo vi
setw -g mode-keys vi

# Entrar no copy-mode
bind [ copy-mode

# Sair do copy-mode
bind ] paste-buffer

# Seleção/copiar usando vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Home/End no copy mode
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Scroll pelo mouse funciona por causa de:
# set -g mouse on

# Status bar
set -g status-position bottom
set -g status-interval 5

set -g status-left " #S "
set -g status-left-length 30

set -g status-right " %Y-%m-%d %H:%M "

# Janelas
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Atalhos úteis
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Novo pane em tela cheia temporariamente
bind z resize-pane -Z
